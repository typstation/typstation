[package]
name = "typstation"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
description = "A Typst editor with live preview. Work in progress."
repository = "https://github.com/typstation/typstation"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["typst", "editor", "pdf", "typesetting"]
categories = ["text-editors", "command-line-utilities"]

# Só o que está listado aqui vai para o crates.io. Sem isto, a saída da
# aplicação (`out/`) e as anotações locais (`.local/`) entrariam no pacote.
include = [
    "/src",
    "/examples",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
typst = "=0.15.0"
typst-layout = "=0.15.0"
typst-svg = "=0.15.0"
typst-kit = { version = "=0.15.0", features = [
    "datetime",
    "embedded-fonts",
    "scan-fonts",
    "system-downloader",
    "system-files",
] }
typst-iced-editor = "0.1.3"
iced = { version = "0.14", features = ["svg", "tokio"] }
rfd = "0.17.2"
tempfile = "3.27.0"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
typst-pdf = "=0.15.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
