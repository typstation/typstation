[package]
name = "typst-iced-editor"
version = "0.1.3"
edition = "2021"
rust-version = "1.92"
description = "A code editor widget for iced, focused on Typst"
homepage = "https://github.com/typstation/typst-iced-editor"
keywords = ["iced", "typst", "editor", "widget", "gui"]
categories = ["gui", "text-editors"]
license = "MIT"
repository = "https://github.com/typstation/typst-iced-editor"

[dependencies]
iced_core = "0.14"
# Keep this on the 0.15 semver line: Buffer::root exposes typst-syntax
# nodes, so downstream Typst tooling must resolve to a compatible 0.15.x
# version, but patch releases should not create dependency conflicts.
typst-syntax = "0.15"
unicode-segmentation = "1"
